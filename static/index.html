<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllConverter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #555; margin-bottom: 48px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-2px); }
    .card-icon { font-size: 2rem; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
    .card-desc { color: #666; font-size: 0.85rem; }
    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>AllConverter</h1>
  <p class="subtitle">Convertissez vos fichiers facilement, en un seul endroit.</p>
  <div class="grid">
    <a class="card" href="/converters/dwg-to-svg/">
      <div class="card-icon">📐</div>
      <div class="card-title">DWG / DXF → SVG</div>
      <div class="card-desc">Convertit des plans AutoCAD en SVG vectoriel.</div>
      <span class="badge">Disponible</span>
    </a>
  </div>
</body>
</html>
